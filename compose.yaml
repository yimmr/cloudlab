name: cloud

# ==============================================================================
# cloud 基础设施底座：反向代理网关 + 数据库
#   本文件不包含任何扩展服务（如 hy2）的痕迹，扩展服务请见 services/
# ==============================================================================

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:alpine
    restart: unless-stopped
    ports:
      # 443 仅绑定 TCP，UDP 443 留给宿主机的 Hysteria 2（QUIC）使用
      - "80:80"
      - "443:443/tcp"
    # 注意: 网关不需要 env_file，Compose 会自动读取项目目录下的 .env 做变量插值
    environment:
      CADDY_INGRESS_NETWORKS: ${NETWORK_ID:-web_gateway}
    volumes:
      - ./infra/caddy/data:/data
      - ./infra/caddy/config:/config
      - ./sites/default:/srv
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # 全局关闭 HTTP/3 协议支持并禁用 Alt-Svc 头部，防止浏览器向 UDP 443 发起请求劫持 Hysteria 2
      caddy_0.servers.protocols: "h1 h2"
      caddy_1: ${SITE_DOMAIN:-site.localhost}
      caddy_1.root: "* /srv"
      caddy_1.file_server: ""
    networks:
      - gateway_net

  db:
    image: mariadb:lts
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M
    volumes:
      - ./infra/dbdata:/var/lib/mysql
    env_file: .env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - gateway_net

networks:
  gateway_net:
    name: ${NETWORK_ID:-web_gateway}